services:
  novel-reader:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      READER_ORIGIN: https://txt.zhijianku.com
      READER_ALLOW_EMBEDDING: "true"
      READER_ADMIN_TOKEN: ${READER_ADMIN_TOKEN:?请先设置随机发布凭据}
      READER_DATA_DIR: /app/data
      XDG_CONFIG_HOME: /tmp/browser-config
      XDG_CACHE_HOME: /tmp/browser-cache
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
